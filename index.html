<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-visual" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0a0e1a" />
    <title>Wayfarer Online</title>
    <!-- explicit icon: without it browsers request /favicon.ico -> startup 404 -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Wayfarer" />
    <meta name="description" content="Wayfarer Online - a cozy Game Boy-style open-world action RPG. Solo or together." />
    <!-- fonts used by the splash + title: fetch at top priority, in parallel with the JS -->
    <link rel="preload" href="/assets/fonts/silkscreen/Silkscreen-Regular.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="/assets/fonts/jacquard12/Jacquard12-Regular.ttf" as="font" type="font/ttf" crossorigin />
    <style>
      @font-face {
        font-family: 'Jacquard12';
        src: url('/assets/fonts/jacquard12/Jacquard12-Regular.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: 'Jersey10';
        src: url('/assets/fonts/jersey10/Jersey10-Regular.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: 'PixelifySans';
        src: url('/assets/fonts/pixelifysans/PixelifySans_wght_.ttf') format('truetype');
        font-weight: 100 900;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: 'Silkscreen';
        src: url('/assets/fonts/silkscreen/Silkscreen-Regular.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: 'Silkscreen';
        src: url('/assets/fonts/silkscreen/Silkscreen-Bold.ttf') format('truetype');
        font-weight: bold;
        font-style: normal;
        font-display: block;
      }
      html, body {
        margin: 0; padding: 0; background: #0a0e1a; height: 100%; overflow: hidden;
        position: fixed; inset: 0; width: 100%;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none; user-select: none;
        -webkit-tap-highlight-color: transparent;
        font-family: 'Silkscreen', monospace;
      }
      /* Background video for title screen */
      #bg-video-container {
        position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 0; overflow: hidden; background: #0a0e1a;
      }
      #bg-video-container video {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0.75;
      }
      /* canvas sits inside the safe area (notch / home indicator); transparent canvas shows background video */
      #game { position: fixed; top: env(safe-area-inset-top, 0px); right: env(safe-area-inset-right, 0px); bottom: env(safe-area-inset-bottom, 0px); left: env(safe-area-inset-left, 0px); background: transparent; z-index: 1; }
      #game canvas {
        image-rendering: pixelated; image-rendering: crisp-edges;
        touch-action: none; display: block; width: 100% !important; height: 100% !important;
        background: transparent !important;
      }
      /* Instant DOM splash (painted before any JS runs); BootScene drives the bar and removes it. */
      #splash {
        position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: radial-gradient(ellipse at 50% 40%, #1a103c 0%, #0a0e1a 60%, #050714 100%); color: #14f195;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        transition: opacity .35s ease; text-align: center;
      }
      #splash.out { opacity: 0; pointer-events: none; }
      #splash h1 { margin: 0 0 6px; font: 400 clamp(34px, 9vw, 64px)/1 'Jacquard12', 'Silkscreen', monospace; letter-spacing: 1px; color: #14f195; text-shadow: 0 3px 0 #050714, 0 0 18px rgba(20,241,149,.25); }
      #splash .sub { font: 400 11px 'Silkscreen', monospace; color: #6b7a99; letter-spacing: 2px; margin-bottom: 26px; }
      #splash .bar { width: min(260px, 70vw); height: 14px; background: #050714; border: 2px solid #1a103c; box-shadow: 3px 3px 0 #0a0e1a; padding: 2px; box-sizing: border-box; }
      #splash .bar > i { display: block; height: 100%; width: 4%; background: linear-gradient(#03e1ff, #14f195 60%, #0db87a); transition: width .15s linear; }
      #splash .pct { margin-top: 8px; font: 400 10px 'Silkscreen', monospace; color: #6b7a99; }
      #splash .tip { margin-top: 22px; max-width: min(380px, 84vw); min-height: 32px; font: 400 13px/1.35 'PixelifySans', monospace; color: #9945ff; }
      /* Force font preload — invisible spans make browser fetch the files early */
      #font-preload {
        position: absolute; opacity: 0; pointer-events: none;
        font-size: 1px; white-space: nowrap; overflow: hidden; width: 1px; height: 1px;
      }
    </style>
  </head>
  <body>
    <!-- Full-screen background trailer video -->
    <div id="bg-video-container">
      <video id="bg-video" autoplay loop muted playsinline poster="/trailer/wayfarer_login_bg.gif" src="/trailer/wayfarer_login_bg.mp4" style="opacity:0.75;"></video>
    </div>
    <!-- Force browser to fetch pixel fonts before Phaser starts -->
    <div id="font-preload" aria-hidden="true">
      <span style="font-family:'Jacquard12'">W</span>
      <span style="font-family:'Jersey10'">W</span>
      <span style="font-family:'PixelifySans'">W</span>
      <span style="font-family:'Silkscreen'">W</span>
    </div>
    <div id="splash" role="status" aria-live="polite">
      <h1>WAYFARER ONLINE</h1>
      <div class="sub">A COZY OPEN WORLD</div>
      <div class="bar"><i id="splash-bar"></i></div>
      <div class="pct" id="splash-pct">LOADING 0%</div>
      <div class="tip" id="splash-tip"></div>
    </div>
    <div id="game"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
