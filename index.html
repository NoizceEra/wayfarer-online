<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-visual" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0f380f" />
    <title>Wayfarer Online</title>
    <!-- explicit icon: without it browsers request /favicon.ico -> startup 404 -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Wayfarer" />
    <meta name="description" content="Wayfarer Online - a cozy Game Boy-style open-world action RPG. Solo or together." />
    <!-- Keep the handle in step with SOCIAL_HANDLE in src/scenes/TitleScene.js (which draws
         the clickable footer link; static HTML cannot import from there). -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@Wayfarer_Online" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Wayfarer Online" />
    <meta property="og:title" content="Wayfarer Online" />
    <meta property="og:description" content="A cozy Game Boy-style open-world action RPG. Solo or together. Free to play in your browser." />
    <meta property="og:url" content="https://wayfarer-online.vercel.app/" />
    <!-- fonts used by the splash + title: fetch at top priority, in parallel with the JS -->
    <link rel="preload" href="/assets/fonts/silkscreen/Silkscreen-Regular.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="/assets/fonts/jacquard12/Jacquard12-Regular.ttf" as="font" type="font/ttf" crossorigin />
    <style>
      @font-face {
        font-family: 'Jacquard12';
        src: url('/assets/fonts/jacquard12/Jacquard12-Regular.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: 'Jersey10';
        src: url('/assets/fonts/jersey10/Jersey10-Regular.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: 'PixelifySans';
        src: url('/assets/fonts/pixelifysans/PixelifySans_wght_.ttf') format('truetype');
        font-weight: 100 900;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: 'Silkscreen';
        src: url('/assets/fonts/silkscreen/Silkscreen-Regular.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: 'Silkscreen';
        src: url('/assets/fonts/silkscreen/Silkscreen-Bold.ttf') format('truetype');
        font-weight: bold;
        font-style: normal;
        font-display: block;
      }
      html, body {
        margin: 0; padding: 0; background: #0f380f; height: 100%; overflow: hidden;
        position: fixed; inset: 0; width: 100%;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none; user-select: none;
        -webkit-tap-highlight-color: transparent;
        font-family: 'Silkscreen', monospace;
      }
      /* canvas sits inside the safe area (notch / home indicator); the margin shows the olive page background */
      #game { position: fixed; top: env(safe-area-inset-top, 0px); right: env(safe-area-inset-right, 0px); bottom: env(safe-area-inset-bottom, 0px); left: env(safe-area-inset-left, 0px); background: #0f380f; }
      #game canvas {
        image-rendering: pixelated; image-rendering: crisp-edges;
        touch-action: none; display: block; width: 100% !important; height: 100% !important;
      }
      /* Instant DOM splash (painted before any JS runs); BootScene drives the bar and removes it. */
      #splash {
        position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: radial-gradient(ellipse at 50% 40%, #1a4d1a 0%, #0f380f 60%, #071c07 100%); color: #9bbc0f;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        transition: opacity .35s ease; text-align: center;
      }
      #splash.out { opacity: 0; pointer-events: none; }
      #splash h1 { margin: 0 0 6px; font: 400 clamp(34px, 9vw, 64px)/1 'Jacquard12', 'Silkscreen', monospace; letter-spacing: 1px; color: #9bbc0f; text-shadow: 0 3px 0 #051208, 0 0 18px rgba(155,188,15,.25); }
      #splash .sub { font: 400 11px 'Silkscreen', monospace; color: #6b8c0f; letter-spacing: 2px; margin-bottom: 26px; }
      #splash .bar { width: min(260px, 70vw); height: 14px; background: #051208; border: 2px solid #306230; box-shadow: 3px 3px 0 #0a1e0a; padding: 2px; box-sizing: border-box; }
      #splash .bar > i { display: block; height: 100%; width: 4%; background: linear-gradient(#c8e030, #9bbc0f 60%, #7fa00f); transition: width .15s linear; }
      #splash .pct { margin-top: 8px; font: 400 10px 'Silkscreen', monospace; color: #8bac0f; }
      #splash .tip { margin-top: 22px; max-width: min(380px, 84vw); min-height: 32px; font: 400 13px/1.35 'PixelifySans', monospace; color: #c9a23a; }
      #splash .social { margin-top: 14px; font: 400 11px 'Silkscreen', monospace; color: #7fa00f; letter-spacing: 1px; text-decoration: none; border-bottom: 1px solid #306230; padding-bottom: 2px; }
      #splash .social:hover, #splash .social:focus-visible { color: #e8f5a0; border-bottom-color: #9bbc0f; }
      /* Force font preload — invisible spans make browser fetch the files early */
      #font-preload {
        position: absolute; opacity: 0; pointer-events: none;
        font-size: 1px; white-space: nowrap; overflow: hidden; width: 1px; height: 1px;
      }
    </style>
  </head>
  <body>
    <!-- Force browser to fetch pixel fonts before Phaser starts -->
    <div id="font-preload" aria-hidden="true">
      <span style="font-family:'Jacquard12'">W</span>
      <span style="font-family:'Jersey10'">W</span>
      <span style="font-family:'PixelifySans'">W</span>
      <span style="font-family:'Silkscreen'">W</span>
    </div>
    <div id="splash" role="status" aria-live="polite">
      <h1>WAYFARER ONLINE</h1>
      <div class="sub">A COZY OPEN WORLD</div>
      <div class="bar"><i id="splash-bar"></i></div>
      <div class="pct" id="splash-pct">LOADING 0%</div>
      <div class="tip" id="splash-tip"></div>
      <a class="social" href="https://x.com/Wayfarer_Online" target="_blank" rel="noopener noreferrer me" aria-label="Wayfarer Online on X">@Wayfarer_Online</a>
    </div>
    <div id="game"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
